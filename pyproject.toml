[project]
name = "ocs-ai-gateway"
version = "1.0.0"
description = "给 OCS 网课助手用的 AI 题库网关：多模型池、自动故障切换、答案缓存、网页管理台"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "你的名字" }]
keywords = ["ocsjs", "ocs", "answererwrapper", "fastapi", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/你的用户名/ocs-ai-gateway"
Issues = "https://github.com/你的用户名/ocs-ai-gateway/issues"

[tool.uv]
package = false
